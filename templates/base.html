<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Data Analyst - Modern Analytics Platform{% endblock %}</title>
    <!-- Modern Styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js for Interactive Data Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app-container">
    <!-- Mobile Sidebar Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Collapsible Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <span class="brand-title">AI Data Analyst</span>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-title">Navigation</div>
            <button class="nav-item active" onclick="switchTab('dashboard-view', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect width="7" height="9" x="3" y="3" rx="1"/>
                    <rect width="7" height="5" x="14" y="3" rx="1"/>
                    <rect width="7" height="9" x="14" y="12" rx="1"/>
                    <rect width="7" height="5" x="3" y="16" rx="1"/>
                </svg>
                <span>Dashboard</span>
            </button>
            <button class="nav-item" onclick="switchTab('dashboard-view', this); document.getElementById('userInput')?.focus();">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>Ask Data (Chat)</span>
            </button>
            <button class="nav-item" onclick="switchTab('quality-view', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="m9 12 2 2 4-4"/>
                </svg>
                <span>Data Quality</span>
            </button>
            <button class="nav-item" onclick="switchTab('kpi-view', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="6"/>
                    <circle cx="12" cy="12" r="2"/>
                </svg>
                <span>KPIs & Targets</span>
            </button>
            <button class="nav-item" onclick="switchTab('alerts-view', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span>Alert History</span>
            </button>
            <button class="nav-item" onclick="switchTab('upload-view', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" x2="12" y1="3" y2="15"/>
                </svg>
                <span>Upload Dataset</span>
            </button>
            <button class="nav-item" onclick="switchTab('preview-view', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M3 3h18v18H3z"/>
                    <path d="M21 9H3"/>
                    <path d="M21 15H3"/>
                    <path d="M9 3v18"/>
                </svg>
                <span>Dataset Preview</span>
            </button>

            <div class="nav-section-title" style="margin-top: 16px;">Active Dataset</div>
            <!-- Active Dataset Sidebar Pill -->
            <div id="sidebarDatasetInfo" class="sidebar-dataset-card">
                <div class="dataset-card-header">
                    <span id="sidebarDatasetName">No CSV Loaded</span>
                    <span id="sidebarDatasetStatus" class="dataset-card-status" style="color: var(--text-muted); display: none;">Ready</span>
                </div>
                <div id="sidebarDatasetDetails" class="dataset-card-details">
                    <span>Upload a CSV file to begin instant analytics.</span>
                </div>
            </div>
        </nav>

        <div style="padding: 16px; border-top: 1px solid var(--border-color);">
            <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="resetAnalysisSession()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>New Analysis</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <!-- Top Modern Header -->
        <header class="top-header">
            <div class="header-left">
                <!-- Mobile Toggle Button -->
                <button class="icon-btn" onclick="toggleSidebar()" style="display: none;" id="mobileMenuBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="header-title-wrapper">
                    <h1>Enterprise Data Analyst</h1>
                </div>
                <div id="headerDatasetBadge" class="dataset-pill" style="display: none;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    <span id="headerDatasetFilename">sample.csv</span>
                </div>
            </div>

            <div class="header-actions">
                <!-- Dark / Light Mode Toggle -->
                <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme" onclick="toggleAppTheme()">
                    <!-- Sun icon for dark mode, Moon icon for light mode -->
                    <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <!-- Quick Action New Analysis -->
                <button class="btn-secondary" onclick="resetAnalysisSession()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    <span>Reset</span>
                </button>
            </div>
        </header>

        <!-- Main Viewport Content Block -->
        <main class="content-viewport">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<!-- Global Toast Alerts -->
<div id="toastContainer" class="toast-container"></div>

<!-- Core Client-Side Logic Scripts -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
<script src="{{ url_for('static', filename='js/kpi.js') }}"></script>

</body>
</html>
