<!-- Dataset Overview & Analytics Dashboard Component -->
<div id="dashboardMetricsContainer">
    <div class="kpi-metrics-grid">
        <!-- Rows KPI Card -->
        <div class="kpi-card accent-emerald">
            <div class="kpi-card-header">
                <span>Total Rows</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </div>
            <div id="kpiRowsValue" class="kpi-card-value">0</div>
            <div class="kpi-card-footer">Records available for querying</div>
        </div>

        <!-- Columns KPI Card -->
        <div class="kpi-card accent-purple">
            <div class="kpi-card-header">
                <span>Columns</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                    <path d="M9 3v18"></path>
                    <path d="M15 3v18"></path>
                </svg>
            </div>
            <div id="kpiColsValue" class="kpi-card-value">0</div>
            <div class="kpi-card-footer">Dynamic features detected</div>
        </div>

        <!-- Numeric Metrics Card -->
        <div class="kpi-card">
            <div class="kpi-card-header">
                <span>Numeric Metrics</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <div id="kpiNumericValue" class="kpi-card-value">0</div>
            <div class="kpi-card-footer">Aggregable numeric columns</div>
        </div>

        <!-- Categorical Dimensions Card -->
        <div class="kpi-card accent-cyan">
            <div class="kpi-card-header">
                <span>Categories</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 9h16M4 15h16M10 3v18M14 3v18"></path>
                </svg>
            </div>
            <div id="kpiCatValue" class="kpi-card-value">0</div>
            <div class="kpi-card-footer">Dimensions for breakdowns</div>
        </div>

        <!-- Date / Time Series Card -->
        <div class="kpi-card accent-amber">
            <div class="kpi-card-header">
                <span>Dates</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </div>
            <div id="kpiDatesValue" class="kpi-card-value">0</div>
            <div class="kpi-card-footer">Time-series dimensions</div>
        </div>
    </div>
</div>

<!-- Dynamic Suggested Questions Component -->
<div class="suggestions-panel" style="margin-top: 20px;">
    <div class="suggestions-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Dataset-Driven Suggested Questions</span>
    </div>
    <div id="suggestedQuestionsContainer" class="suggestions-scroll-container">
        <!-- Dynamically injected chips -->
        <span class="suggestion-chip">Upload a dataset to generate tailored questions</span>
    </div>
</div>
